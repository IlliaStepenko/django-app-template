
services:

  web:
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery:
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery_beat:
    depends_on:
      - db
      - redis
    env_file:
      - .env

  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  pgdata:
